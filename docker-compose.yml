# base ES service definition
x-base-es-service: &base-es-service
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    restart: ${RESTART_POLICY:-always}
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -u elastic:elastic -s -f localhost:9200/_cat/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 120


# cluster.initial_master_nodes: es01,es02
# shared environment for ES
x-base-es-envs: &base-es-envs
  cluster.name: ${CLUSTER_NAME}
  bootstrap.memory_lock: "true"
  xpack.security.enabled: "false"
  xpack.license.self_generated.type: ${LICENSE:-basic}
  http.cors.enabled: "true"
  http.cors.allow-origin: http://localhost:8080,http://127.0.0.1:8080
  http.cors.allow-headers: X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization
  http.cors.allow-credentials: "true"

x-api-common: &api-common
  image: ghcr.io/openfoodfacts/search-a-licious/search_service_image:${TAG:-dev}
  restart: ${RESTART_POLICY:-always}
  environment:
    - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://es01:9200}
    - SENTRY_DNS
    - LOG_LEVEL
    - REDIS_HOST
    - REDIS_PORT
    # Directory where we cache downloaded taxonomies files
    - TAXONOMY_CACHE_DIR
    # Path of the yaml configuration file
    - CONFIG_PATH
    # URL of the OFF API
    - OFF_API_URL
  networks:
    - default
    - common_net
  volumes:
    - ./data:/opt/search/data


services:
  sync:
    build:
      context: .
      dockerfile: docker/sync.Dockerfile
      args:
        TAG: ${TAG:-dev}
    restart: ${RESTART_POLICY:-always}
    command: ["sh", "-c", "sleep infinity"]
    environment:
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://es01:9200}
      - CONFIG_PATH
      - TAXONOMY_CACHE_DIR
      - LOG_LEVEL
      - REDIS_HOST
      - REDIS_PORT
      - OFF_API_URL
      - MONGO_URI=mongodb://mongo:27017
      - OFF_MONGO_DUMP_URL=${OFF_MONGO_DUMP_URL:-https://static.openfoodfacts.org/data/openfoodfacts-mongodbdump.gz}
      - OFF_DELTA_INDEX_URL=${OFF_DELTA_INDEX_URL:-https://static.openfoodfacts.org/data/delta/index.txt}
      - OFF_SYNC_MIN_PRODUCTS=${OFF_SYNC_MIN_PRODUCTS:-10000000}
      - OFF_SYNC_IMPORT_PROCESSES=${OFF_SYNC_IMPORT_PROCESSES:-4}
      - OFF_SYNC_ES_ALIAS=${OFF_SYNC_ES_ALIAS:-openfoodfacts}
      - OFF_SYNC_CLEANUP_INDEXES=${OFF_SYNC_CLEANUP_INDEXES:-false}
    depends_on:
      mongo:
        condition: service_healthy
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
    networks:
      - default
      - common_net
    volumes:
      - ./data:/opt/search/data

  mongo:
    image: public.ecr.aws/docker/library/mongo:8.0
    restart: ${RESTART_POLICY:-always}
    stop_grace_period: 1m
    volumes:
      - off-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
      
  es01:
    <<: *base-es-service
    environment:
      <<: *base-es-envs
      node.name: es01
      discovery.seed_hosts: es02
    volumes:
      - esdata01:/usr/share/elasticsearch/data

  es02:
    <<: *base-es-service
    environment:
      <<: *base-es-envs
      node.name: es02
      discovery.seed_hosts: es01
    depends_on:
      - es01
    volumes:
      - esdata02:/usr/share/elasticsearch/data

  # elasticsearch browser
  elasticvue:
    image: cars10/elasticvue
    restart: ${RESTART_POLICY:-always}
    environment:
      - NGINX_BASIC_AUTH_USER_PASSWD
    volumes:
      # we add an entrypoint to eventually add basic auth
      - ./docker/elasticvue-entrypoint.sh:/bin/elasticvue-entrypoint.sh:ro
    entrypoint: ["/bin/elasticvue-entrypoint.sh"]
    # because redefining entrypoint, oblige to redefine command…
    command: ["nginx", "-g", "daemon off;"]

  api:
    <<: *api-common

  # frontend is nginx serving static files and proxying to API
  search_frontend:
    # this is the nginx frontend serving react static version or redirecting queries
    image: ghcr.io/openfoodfacts/search-a-licious/search_front_image:${TAG:-dev}
    restart: ${RESTART_POLICY:-always}
    depends_on:
      - api
    environment:
      # enabling prod config and disabling dev one
      PROD_UI_SUFFIX: "${PROD_UI_SUFFIX-}"
      DEV_UI_SUFFIX: "${DEV_UI_SUFFIX--static}"
    volumes:
      # Nginx, we use templates dir to be able to use environment vars
      - ./confs/nginx.conf:/etc/nginx/templates/default.conf.template
    expose:
      - "80"
    build:
      context: frontend
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    labels:
      - 'traefik.http.middlewares.off-search-basic-auth.basicauth.users=${BASIC_AUTH_PWD}'
      - 'coolify.traefik.middlewares=off-search-basic-auth'



volumes:
  esdata01:
  esdata02:
  off-mongo-data:

networks:
  # this is the network shared with product opener
  common_net:
    name: ${COMMON_NET_NAME}
